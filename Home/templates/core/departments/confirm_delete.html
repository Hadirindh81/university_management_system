{% extends 'base.html' %}
{% block title %}Delete Department{% endblock %}

{% block content %}
<div class="alert alert-danger">
  <h4>Are you sure you want to delete the department "{{ department.name }}"?</h4>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'department_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
