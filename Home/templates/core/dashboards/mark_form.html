{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Grade Assignment</h2>
  <p><strong>Assignment:</strong> {{ assignment.title }}</p>
  <p><strong>Student:</strong> {{ student.first_name }} {{ student.last_name }}</p>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Marks</label>
      <input type="number" step="0.01" name="marks" class="form-control" value="{{ mark.marks|default:'' }}">
    </div>
    <button type="submit" class="btn btn-success">Save Marks</button>
    <a href="{% url 'teacher_course_detail' assignment.course.pk %}" class="btn btn-secondary">Back</a>
  </form>
</div>
{% endblock %}
