{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-body text-center">
      <h3 class="mb-4 text-danger">Confirm Delete</h3>
      <p class="mb-4">
        Are you sure you want to delete the fee record for 
        <strong>{{ fee.student }}</strong> 
        (Total: {{ fee.total_amount }}, Paid: {{ fee.amount_paid }})?
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
          <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
          <a href="{% url 'fee_list' %}" class="btn btn-secondary px-4">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
