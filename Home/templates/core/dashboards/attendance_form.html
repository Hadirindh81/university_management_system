{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h3>Attendance for {{ course.name }} on {{ date }}</h3>
  <form method="post">
    {% csrf_token %}
    <table class="table">
      <thead><tr><th>#</th><th>Student</th><th>Present</th></tr></thead>
      <tbody>
        {% for e in enrollments %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ e.student.first_name }} {{ e.student.last_name }}</td>
          <td>
            <input type="checkbox" name="present_{{ e.pk }}"
                   {% if e.pk in present_ids %}checked{% endif %}>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <button class="btn btn-primary" type="submit">Save Attendance</button>
    <a class="btn btn-secondary" href="{% url 'teacher_course_detail' course.pk %}">Back</a>
  </form>
</div>
{% endblock %}
