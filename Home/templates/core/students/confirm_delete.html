{% extends 'base.html' %}
{% block title %}Confirm Student Deletion{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="card shadow border-0">
    <div class="card-body text-center">
      <h3 class="text-danger mb-4">Confirm Student Deletion</h3>
      <p>Are you sure you want to delete student <strong>{{ object }}</strong>?</p>

      <form method="post" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
        <a href="{% url 'students_list' %}" class="btn btn-secondary px-4 ms-2">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
