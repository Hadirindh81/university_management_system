{% extends 'base.html' %}
{% block title %}Department Form{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h4 class="mb-0">Department Form</h4>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Save</button>
      <a href="{% url 'department_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
