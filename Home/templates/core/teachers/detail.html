{% extends 'base.html' %}
{% block title %}Teacher Detail{% endblock %}
{% block content %}
<h2>{{ teacher.first_name }} {{ teacher.last_name }}</h2>
<ul>
  <li><strong>Email:</strong> {{ teacher.email }}</li>
  <li><strong>Department:</strong> {{ teacher.department }}</li>
  <li><strong>Hire Date:</strong> {{ teacher.hire_date }}</li>
</ul>
<a href="{% url 'teachers_list' %}" class="btn btn-secondary">Back to List</a>
{% endblock %}
